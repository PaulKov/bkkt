version: 1
connectors_root: .
ignore_dirs:
  - .git
  - .cache
  - .idea
  - .vscode
  - docs
  - __global
  - __init_templates
  - schemas
default_cluster: default

clusters:
  default:
    dev:
      connect:
        scheme: http
        port: 8083
        hosts: ["127.0.0.1"]

gitlab:
  api_url: ${CI_API_V4_URL:-https://gitlab.example.com/api/v4}
  project_id: ${CI_PROJECT_ID:-}
  mr_iid: ${CI_MERGE_REQUEST_IID:-}

naming:
  enabled: true
  strict: true
  rules:
    - id: source_default
      applies_to:
        type: [source]
      template: "{env}.{domain}.{dataset}.source.{system}.{index}"
    - id: sink_default
      applies_to:
        type: [sink]
      template: "{env}.{domain}.{dataset}.sink.{layer}.{system}.{index}"

sync:
  prune:
    allow_regex: ["^{env}\\."]
    deny_regex: ["^_"]

safety:
  direct_put:
    enabled: false
