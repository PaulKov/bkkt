[project]
name = "bkkt"
version = "0.1.0a1"
description = "GitOps CLI for managing Kafka Connect connectors from JSON manifests"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Pavel Kovalev" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "requests>=2.31.0",
  "PyYAML>=6.0.1",
  "argcomplete>=3.2.3",
  "kafka-python>=2.0.2",
  "aws-msk-iam-sasl-signer-python>=1.0.2",
  "boto3>=1.34.0",
  "jsonschema>=4.0.0",
  "ruamel-yaml>=0.18.6",
  "botocore[crt]>=1.34.0",
]

[project.optional-dependencies]
kubernetes = [
  "kubernetes>=30.1.0",
]
dev = [
  "pytest>=8.0.0",
  "mypy>=1.11.2",
  "pre-commit>=3.7.1",
  "ruff==0.16.6",
  "black==24.8.0",
  "types-PyYAML>=6.0.0.0",
  "types-requests>=2.31.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "mypy>=1.11.2",
  "pre-commit>=3.7.1",
  "ruff==0.16.6",
  "black==24.8.0",
  "types-PyYAML>=6.0.0.0",
  "types-requests>=2.31.0.0",
]

[tool.uv]
# uv installs dependency-groups from default-groups (default: ['dev'])
default-groups = ["dev"]

[project.scripts]
bkkt = "connectctl.cli:main"

[project.urls]
Homepage = "https://github.com/PaulKov/bkkt"
Repository = "https://github.com/PaulKov/bkkt"
Issues = "https://github.com/PaulKov/bkkt/issues"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "connectctl"
module-root = "."
