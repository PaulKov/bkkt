name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: uv run ruff check connectctl tests

      - name: Format check (black)
        run: uv run black --check connectctl tests

      - name: Mypy
        run: uv run mypy --no-incremental connectctl

      - name: Pytest
        run: uv run pytest -q

      - name: Generated docs check
        run: |
          uv run bkkt docs generate-cli-reference --check --show-diff
          uv run bkkt docs update-dev-metrics --check

      - name: OSS hygiene + readiness
        run: |
          uv run bkkt oss hygiene --scope public
          uv run bkkt oss hygiene --scope repository
          uv run bkkt oss readiness

      - name: Demo smoke
        run: uv run bkkt demo smoke

      - name: Build artifacts
        run: uv build

      - name: Twine check
        run: uvx twine check dist/*

      - name: Clean wheel install + CLI smoke
        run: |
          uv venv /tmp/bkkt-wheel-venv
          uv pip install --python /tmp/bkkt-wheel-venv/bin/python dist/*.whl
          /tmp/bkkt-wheel-venv/bin/bkkt --version
          /tmp/bkkt-wheel-venv/bin/bkkt --help >/dev/null
          /tmp/bkkt-wheel-venv/bin/bkkt demo init /tmp/bkkt-demo-wheel
          /tmp/bkkt-wheel-venv/bin/bkkt demo smoke
